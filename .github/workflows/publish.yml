name: Публикация

# Запускается чаще, чем нужно публиковать: скрипт сам решает, пора ли,
# исходя из времени прошлой публикации. Поэтому пропуск запуска планировщиком
# (обычное дело на бесплатном тарифе) ленту не ломает.
on:
  schedule:
    # Время по Гринвичу, в скобках московское. Точки выбраны по пикам
    # активности: утренняя дорога, обед, конец рабочего дня, вечер.
    #   06:05 UTC = 09:05 МСК
    #   10:05 UTC = 13:05 МСК
    #   15:05 UTC = 18:05 МСК
    #   18:05 UTC = 21:05 МСК
    - cron: "5 6,10,15,18 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Куда публиковать"
        type: choice
        options: [admin, channel]
        default: admin
      force:
        description: "Игнорировать интервал между постами"
        type: boolean
        default: false

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Опубликовать следующий пост
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          # PUBLISH_TARGET задаётся в Settings → Variables. Пока admin —
          # посты уходят в личку с кнопками. Меняешь на channel, когда готов.
          TARGET: ${{ inputs.target || vars.PUBLISH_TARGET || 'admin' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python -m src.publish --target "$TARGET" $FORCE

      - name: Сохранить состояние
        run: |
          git config user.name "mcomag-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ content/
          git diff --cached --quiet || git commit -m "публикация: пост отправлен"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
