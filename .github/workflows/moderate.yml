name: Дежурство бота

# Разовый разбор нажатий, а не долгая смена. Причина — деньги: репозиторий
# приватный, а на бесплатном тарифе приватному репозиторию положено
# 2000 минут Actions в месяц. Смена по 55 минут раз в час — это около
# 10 000 минут, впятеро больше лимита. Разовый запуск стоит одну минуту
# (GitHub округляет задание вверх до минуты), то есть около 700 минут
# в месяц в худшем случае.
#
# Платим за это задержкой: нажатие кнопки лежит в очереди Telegram, пока
# не поднимется следующий запуск. Владелец решил 10 сентября 2026, что
# задержка терпима, а счёт за минуты — нет. Нужен мгновенный ответ —
# запусти смену руками через workflow_dispatch, указав минуты.
#
# :37, а не :00 — намеренно. GitHub прямо пишет, что начало часа это пик
# нагрузки и запуски оттуда придерживают первыми. По логам этого репозитория
# видно ровно это: публикация с крона на :05 отрабатывает вся, а дежурство
# с :00 стартовало примерно шесть раз в сутки из двадцати четырёх.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Сколько минут дежурить (пусто — разовый разбор)"
        type: string
        default: ""

# Состояние теперь коммитит сам воркфлоу, а значит он дерётся за ветку
# с публикацией и генерацией — группа у них общая.
concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  moderate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Обложки постов рисуются шрифтом с диска: встроенный в Pillow кириллицы
      # не знает. На ubuntu-latest DejaVu обычно есть, но если нет — доставляем.
      # Шаг не критичен: без шрифта пост уйдёт текстом, ронять из-за картинки
      # публикацию нельзя.
      - name: Шрифт для обложек
        continue-on-error: true
        run: sudo apt-get install -y -qq fonts-dejavu-core

      - name: Разобрать нажатия
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          if [ -n "$MINUTES" ]; then
            python -m src.moderate --serve "$MINUTES"
          else
            python -m src.moderate
          fi

      # Обязателен именно здесь. Разовый режим состояние на диск пишет,
      # но в репозиторий не отправляет: своего push_state() у него нет,
      # он есть только у смены. Без этого шага машина исчезнет вместе
      # с решением владельца — опубликованный пост останется в очереди
      # в git, и следующая публикация пришлёт его на утверждение заново,
      # а нажатие Telegram переотдаст, потому что offset не подтверждён.
      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "mcomag-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ content/
          git diff --cached --quiet || git commit -m "дежурство: решения по постам"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
